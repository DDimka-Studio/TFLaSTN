name: Build TFLaSTN

on:
  push:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Build on Linux
        if: matrix.os == 'ubuntu-latest'
        run: g++ -O3 TFLaSTN.cpp -o TFLaSTN

      - name: Build on macOS
        if: matrix.os == 'macos-latest'
        run: clang++ -O3 TFLaSTN.cpp -o TFLaSTN

      - name: Set up MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@main

      - name: Build on Windows
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: cl /O2 TFLaSTN.cpp /Fe:TFLaSTN.exe

      - name: Upload binaries
        uses: actions/upload-artifact@main
        with:
          name: TFLaSTN-${{ matrix.os }}
          path: |
            TFLaSTN
            TFLaSTN.exe
          if-no-files-found: ignore
